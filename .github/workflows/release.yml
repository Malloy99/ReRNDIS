name: Release

on:
  push:
    tags: ["v*", "rel*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          swift --version

      - name: Stamp the tag version into the daemon
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/let daemonVersion = \".*\"/let daemonVersion = \"$VERSION\"/" \
            Sources/ReRNDISDaemon/RerndisdMain.swift
          grep daemonVersion Sources/ReRNDISDaemon/RerndisdMain.swift

      - name: Test
        run: swift test

      - name: Build the universal distribution
        run: make dist

      - name: Verify universal slices
        run: |
          lipo -info dist/ReRNDIS-dist/ReRNDISDaemon dist/ReRNDIS-dist/rerndisctl
          lipo -info dist/ReRNDIS-dist/ReRNDIS.app/Contents/MacOS/ReRNDIS

      - name: Name the artifacts
        run: |
          NAME="ReRNDIS-${GITHUB_REF_NAME//\//-}"
          mv dist/ReRNDIS-dist.zip "dist/$NAME.zip"
          mv dist/ReRNDIS-dist.dmg "dist/$NAME.dmg"
          echo "ZIP=dist/$NAME.zip" >> "$GITHUB_ENV"
          echo "DMG=dist/$NAME.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ReRNDIS-universal
          path: |
            ${{ env.ZIP }}
            ${{ env.DMG }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "ReRNDIS $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
