name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: SwiftLint
        continue-on-error: true
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict --quiet
